<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Treino Psicotécnico">
    <title>Centro de Treino Psicotécnico — Seleção de Pilotos</title>
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #26354d;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 960px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .title-block h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.4px;
        }

        .title-block p {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-control {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .btn-control:hover {
            background: #283548;
            border-color: #64748b;
        }

        .btn-control:active {
            transform: scale(0.98);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 18px;
        }

        .game-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 22px;
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            cursor: pointer;
            transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .card-tag {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            background: #0f172a;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .card-body h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-body p {
            font-size: 0.85rem;
            line-height: 1.55;
            color: var(--text-muted);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.85rem;
            font-weight: 600;
            color: #60a5fa;
        }

        .game-card:hover .card-footer {
            color: #93c5fd;
        }

        .status-box {
            text-align: center;
            padding: 36px 20px;
            background: #0b1120;
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .status-box.error {
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        code {
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
        }

        /* Overlay de Jogo em Ecrã Inteiro com Botão de Saída para o Portal */
        .game-player-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: #020617;
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
        }

        .game-player-overlay.active {
            display: flex;
        }

        .game-player-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background-color: #080c14;
        }

        .floating-portal-bar {
            position: fixed;
            top: max(10px, env(safe-area-inset-top));
            right: max(14px, env(safe-area-inset-right));
            z-index: 120;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-exit-portal {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.45);
            padding: 8px 14px;
            border-radius: 9px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .btn-exit-portal:hover {
            background: rgba(30, 41, 59, 0.98);
            border-color: #60a5fa;
            color: #93c5fd;
        }

        .btn-exit-portal:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <div class="container" id="portalContainer">
        <header>
            <div class="title-block">
                <h1>Simuladores de Aptidão Psicotécnica</h1>
                <p>Seleciona um módulo de treino para iniciar</p>
            </div>
            <div class="header-actions">
                <button type="button" class="btn-control" onclick="loadGames(true)" title="Atualizar lista de simuladores">
                    <span>↻</span>
                    <span>Atualizar</span>
                </button>
                <button type="button" class="btn-control" id="portalFullscreenBtn" onclick="toggleFullScreen()" title="Alternar Ecrã Inteiro">
                    <span id="fsIcon">⛶</span>
                    <span id="fsLabel">Full Screen</span>
                </button>
            </div>
        </header>

        <div id="contentArea">
            <div class="status-box">A carregar simuladores...</div>
        </div>
    </div>

    <!-- Contentor do Jogo Ativo com Botão Flutuante para Regressar ao Portal -->
    <div id="gamePlayerOverlay" class="game-player-overlay" aria-hidden="true">
        <div class="floating-portal-bar">
            <button type="button" class="btn-exit-portal" onclick="toggleFullScreen()" title="Alternar Ecrã Inteiro">
                <span>⛶</span>
                <span class="fs-overlay-label">Full Screen</span>
            </button>
            <button type="button" class="btn-exit-portal" onclick="exitGameToPortal()" title="Sair do jogo e voltar ao portal">
                <span>← Portal</span>
            </button>
        </div>
        <iframe id="gameFrame" class="game-player-frame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        const FALLBACK_METADATA = {
            'PistaEPedais.html': {
                title: 'Pista e Pedais',
                desc: 'Controlo de inibição e resposta rápida com os pedais (W / P) consoante o alinhamento da pista e barras transversais.',
                icon: '🛬',
                tag: 'PC & iPhone'
            }
        };

        function toggleFullScreen() {
            try {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            } catch (e) {}
        }

        document.addEventListener('fullscreenchange', () => {
            const isFs = Boolean(document.fullscreenElement);
            const fsLabel = document.getElementById('fsLabel');
            if (fsLabel) {
                fsLabel.textContent = isFs ? 'Sair Full Screen' : 'Full Screen';
            }
            document.querySelectorAll('.fs-overlay-label').forEach(el => {
                el.textContent = isFs ? 'Sair Full Screen' : 'Full Screen';
            });
        });

        function launchGame(href) {
            const overlay = document.getElementById('gamePlayerOverlay');
            const frame = document.getElementById('gameFrame');
            frame.src = href;
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';

            frame.onload = () => {
                try {
                    frame.contentWindow.focus();
                } catch (e) {}
            };
        }

        function exitGameToPortal() {
            const overlay = document.getElementById('gamePlayerOverlay');
            const frame = document.getElementById('gameFrame');
            overlay.classList.remove('active');
            overlay.setAttribute('aria-hidden', 'true');
            frame.src = 'about:blank';
            document.body.style.overflow = '';
        }

        function detectRepoInfo() {
            const host = window.location.hostname;
            const pathParts = window.location.pathname.split('/').filter(Boolean);

            if (host.endsWith('.github.io')) {
                const owner = host.replace('.github.io', '');
                const isProjectPage = pathParts.length > 0 && !pathParts[0].endsWith('.html');
                const repo = isProjectPage ? pathParts[0] : host;
                return { owner, repo };
            }
            return null;
        }

        function formatFileName(filename) {
            return filename
                .replace(/\.html$/i, '')
                .replace(/[_-]+/g, ' ')
                .replace(/([a-z])([A-Z])/g, '$1 $2')
                .replace(/\s+/g, ' ')
                .trim();
        }

        async function parseGameMetadata(filename, idx) {
            const fallback = FALLBACK_METADATA[filename] || {};
            try {
                const res = await fetch(filename);
                if (!res.ok) throw new Error('Fetch falhou');
                const htmlText = await res.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');

                const titleEl = doc.querySelector('title');
                const metaDesc = doc.querySelector('meta[name="description"]');
                const metaIcon = doc.querySelector('meta[name="game-icon"]');
                const metaTag = doc.querySelector('meta[name="game-tag"]');

                let autoIntro = '';
                const firstIntroP = doc.querySelector('.instructions-list p, #startOverlay p, .rules p');
                if (firstIntroP && firstIntroP.textContent) {
                    autoIntro = firstIntroP.textContent.trim();
                }

                const title = (titleEl && titleEl.textContent.trim()) || fallback.title || formatFileName(filename);
                const desc = (metaDesc && metaDesc.getAttribute('content') && metaDesc.getAttribute('content').trim())
                    || fallback.desc
                    || autoIntro
                    || `Simulador interativo (${filename}).`;
                const icon = (metaIcon && metaIcon.getAttribute('content') && metaIcon.getAttribute('content').trim())
                    || fallback.icon
                    || '✈️';
                const tag = (metaTag && metaTag.getAttribute('content') && metaTag.getAttribute('content').trim())
                    || fallback.tag
                    || `Módulo ${idx + 1}`;

                return { href: filename, title, desc, icon, tag };
            } catch {
                return {
                    href: filename,
                    title: fallback.title || formatFileName(filename),
                    desc: fallback.desc || `Ficheiro: ${filename}`,
                    icon: fallback.icon || '✈️',
                    tag: fallback.tag || `Módulo ${idx + 1}`
                };
            }
        }

        async function loadGames(bypassCache = false) {
            const contentArea = document.getElementById('contentArea');
            const repoInfo = detectRepoInfo();

            if (!repoInfo) {
                contentArea.innerHTML = `
                    <div class="status-box error">
                        <strong>Modo Local:</strong> Os simuladores ficam disponíveis automaticamente quando publicados online.
                    </div>`;
                return;
            }

            contentArea.innerHTML = `<div class="status-box">A carregar simuladores disponíveis...</div>`;

            try {
                const apiUrl = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/` + (bypassCache ? `?t=${Date.now()}` : '');
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`Erro HTTP ${response.status}`);
                }

                const files = await response.json();

                const htmlFiles = files
                    .filter(f => f.type === 'file' && /\.html$/i.test(f.name) && f.name.toLowerCase() !== 'index.html' && f.name.toLowerCase() !== '404.html')
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (htmlFiles.length === 0) {
                    contentArea.innerHTML = `
                        <div class="status-box">
                            Nenhum simulador encontrado ainda.
                        </div>`;
                    return;
                }

                const cardsData = await Promise.all(
                    htmlFiles.map((file, idx) => parseGameMetadata(file.name, idx))
                );

                const grid = document.createElement('div');
                grid.className = 'games-grid';

                cardsData.forEach(game => {
                    const card = document.createElement('a');
                    card.href = game.href;
                    card.className = 'game-card';
                    card.addEventListener('click', (e) => {
                        e.preventDefault();
                        launchGame(game.href);
                    });
                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <div class="card-icon">${game.icon}</div>
                                <span class="card-tag">${game.tag}</span>
                            </div>
                            <div class="card-body" style="margin-top: 14px;">
                                <h2>${game.title}</h2>
                                <p>${game.desc}</p>
                            </div>
                        </div>
                        <div class="card-footer">
                            <span>Abrir Simulador</span>
                            <span>&rarr;</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                contentArea.innerHTML = '';
                contentArea.appendChild(grid);

            } catch (err) {
                contentArea.innerHTML = `
                    <div class="status-box error">
                        <strong>Não foi possível carregar a lista de simuladores:</strong> ${err.message}
                    </div>`;
            }
        }

        loadGames();
    </script>
</body>
</html>
